name: VitalScore
options:
  bundleIdPrefix: com.vitalscore
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  VitalScore:
    type: application
    platform: iOS
    sources:
      - path: VitalScore
        excludes:
          - Resources/Info.plist
          - Resources/VitalScore.entitlements
          - Resources/MockData
      - path: VitalScore/Resources/MockData
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vitalscore.app
        INFOPLIST_FILE: VitalScore/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    entitlements:
      path: VitalScore/Resources/VitalScore.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  VitalScoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VitalScoreTests
    dependencies:
      - target: VitalScore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vitalscore.app.tests

schemes:
  VitalScore:
    build:
      targets:
        VitalScore: all
        VitalScoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VitalScoreTests
