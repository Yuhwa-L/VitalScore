name: VitalScore
options:
  bundleIdPrefix: com.vitalscore
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "$(VITALSCORE_DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: "$(VITALSCORE_CODE_SIGN_STYLE)"
    CODE_SIGN_IDENTITY: "$(VITALSCORE_CODE_SIGN_IDENTITY)"
    PROVISIONING_PROFILE_SPECIFIER: "$(VITALSCORE_PROVISIONING_PROFILE_SPECIFIER)"

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.12.4

targets:
  VitalScore:
    type: application
    platform: iOS
    sources:
      - path: VitalScore
        excludes:
          - Resources/Info.plist
          - Resources/VitalScore.entitlements
          - Resources/MockData
      - path: VitalScore/Resources/MockData
        buildPhase: resources
        type: folder
    configFiles:
      Debug: Config/VitalScore.xcconfig
      Release: Config/VitalScore.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(VITALSCORE_BUNDLE_IDENTIFIER)"
        INFOPLIST_FILE: VitalScore/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    entitlements:
      path: VitalScore/Resources/VitalScore.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    dependencies:
      - package: FluidAudio
        product: FluidAudio

  VitalScoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VitalScoreTests
    dependencies:
      - target: VitalScore
    configFiles:
      Debug: Config/VitalScore.xcconfig
      Release: Config/VitalScore.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(VITALSCORE_TEST_BUNDLE_IDENTIFIER)"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  VitalScore:
    build:
      targets:
        VitalScore: all
        VitalScoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VitalScoreTests
